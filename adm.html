<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel ADM | PP UNIGRAN</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--roxo:#6a1e9a;--roxo2:#4a1270;--fundo:#f4f1f8;--borda:#ddd0ea;--r:8px;--verde:#2d7a2d}
body{background:var(--fundo);font-family:Inter,sans-serif;font-size:14px;color:#1a1a1a;min-height:100vh}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.lbox{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:40px;width:100%;max-width:360px;text-align:center}
.lbox h1{font-size:20px;color:var(--roxo2);margin-bottom:8px}
.lbox p{color:#6b6b6b;font-size:13px;margin-bottom:24px}
.lbox input{width:100%;border:1.5px solid var(--borda);border-radius:var(--r);padding:10px 12px;font-size:14px;outline:none;margin-bottom:12px;font-family:Inter,sans-serif}
.lbox input:focus{border-color:var(--roxo)}
.lbox button{width:100%;background:var(--roxo);color:#fff;border:none;border-radius:var(--r);padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif}
#erro{color:#c0392b;font-size:12px;margin-top:10px;display:none}
#app{display:none}
header{background:var(--roxo2);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:16px;font-weight:700}
.header-right{display:flex;align-items:center;gap:16px}
header span{font-size:12px;opacity:.7}
.btn-sair{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:var(--r);padding:6px 14px;font-size:12px;cursor:pointer;font-family:Inter,sans-serif}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--borda);padding:0 24px;overflow-x:auto}
.tab{padding:14px 20px;cursor:pointer;font-size:13px;font-weight:500;color:#6b6b6b;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--roxo);border-bottom-color:var(--roxo);font-weight:600}
.painel{padding:24px;max-width:1100px;margin:0 auto}
.st{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--roxo2);margin:24px 0 10px}
.st:first-child{margin-top:0}
.card{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:20px;margin-bottom:12px}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.cnome{font-weight:600;font-size:15px}
.csub{font-size:12px;color:#6b6b6b;margin-top:2px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
.pendente{background:#fff3cd;color:#856404}
.aprovado{background:#d4edda;color:#155724}
.recusado{background:#f8d7da;color:#721c24}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:14px}
.det{font-size:12px}.det strong{display:block;color:var(--roxo2);font-size:11px;margin-bottom:2px}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{padding:8px 18px;border-radius:var(--r);border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:Inter,sans-serif;text-decoration:none;display:inline-block}
.bok{background:var(--verde);color:#fff}
.bno{background:#eee;color:#333}
.broxo{background:var(--roxo);color:#fff}
.bverm{background:#c0392b;color:#fff}
.vazio{text-align:center;color:#6b6b6b;padding:40px;font-size:13px}
/* Equipamentos - eCards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.ecard{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:16px 10px;text-align:center;cursor:pointer;transition:all .15s;position:relative}
.ecard:hover{border-color:var(--roxo);box-shadow:0 2px 12px rgba(106,30,154,.15);transform:translateY(-2px)}
.ecard-icon{font-size:30px;margin-bottom:8px;display:block}
.ecard-nome{font-size:12px;font-weight:600;color:#1a1a1a;line-height:1.3;margin-bottom:3px}
.ecard-info{font-size:11px;color:#6b6b6b}
.ecard-badge{position:absolute;top:6px;right:6px;background:var(--roxo);color:#fff;border-radius:20px;padding:1px 7px;font-size:10px;font-weight:700}
.ecard-restrito{position:absolute;top:6px;left:6px;font-size:11px}
/* Modal equipamento */
.emodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px}
.emodal.on{display:flex}
.emodal-box{background:#fff;border-radius:var(--r);padding:28px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
.emodal-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.emodal-icon{font-size:36px}
.emodal-title{font-size:17px;font-weight:700;color:var(--roxo2)}
.emodal-sub{font-size:12px;color:#6b6b6b;margin-top:2px}
.pat-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.pat-num{font-size:11px;color:var(--roxo2);font-weight:700;min-width:20px}
.pat-inp{flex:1;border:1.5px solid var(--borda);border-radius:6px;padding:6px 10px;font-size:13px;outline:none;font-family:Inter,sans-serif}
.pat-inp:focus{border-color:var(--roxo)}
.pat-status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;cursor:pointer;white-space:nowrap;border:none}
.pat-del{background:#fde;color:#c0392b;border:none;border-radius:4px;padding:3px 8px;cursor:pointer;font-weight:700;font-size:13px}
/* Alunos */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.acard{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:14px;border-left:4px solid var(--verde)}
.acard.bloqueado{border-left-color:#c0392b}
.acard h3{font-size:13px;font-weight:600;margin-bottom:4px}
.acard p{font-size:12px;color:#6b6b6b;margin-bottom:2px}
.acard .abtns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
/* Configurações */
.cfg{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:20px;margin-bottom:20px}
.cfg h3{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--roxo2);margin-bottom:14px;letter-spacing:.08em}
.sw{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;cursor:pointer}
.sw input{width:16px;height:16px;accent-color:var(--roxo)}
.cmsg{width:100%;border:1.5px solid var(--borda);border-radius:var(--r);padding:8px 10px;font-size:13px;min-height:60px;resize:vertical;margin-bottom:10px;font-family:Inter,sans-serif}
.abtn{background:var(--roxo);color:#fff;border:none;border-radius:var(--r);padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:20px;font-family:Inter,sans-serif;margin-right:8px}
/* Categorias */
.cats-box{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:16px;margin-bottom:16px}
.cats-box h3{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--roxo2);margin-bottom:12px;letter-spacing:.08em}
.cat-tag{display:inline-flex;align-items:center;gap:4px;background:#f4f1f8;border:1px solid var(--borda);border-radius:20px;padding:4px 10px;font-size:12px;margin:4px}
.cat-tag button{background:none;border:none;cursor:pointer;font-size:12px;padding:0 2px;line-height:1}
.cat-tag .cat-del{color:#c0392b}.cat-tag .cat-edit{color:#4a1270}
.cat-input-row{display:flex;gap:8px;margin-top:10px}
.cat-input-row input{flex:1;border:1.5px solid var(--borda);border-radius:var(--r);padding:8px 10px;font-size:13px;outline:none;font-family:Inter,sans-serif}
.cat-input-row button{background:var(--roxo);color:#fff;border:none;border-radius:var(--r);padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
/* Status badges */
.sdisp{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#d4edda;color:#155724}
.semp{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#f8d7da;color:#721c24}
.smanut{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#fff3cd;color:#856404}
/* Modal novo equipamento */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:var(--r);padding:28px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.mbox h2{font-size:16px;color:var(--roxo2);margin-bottom:20px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:12px;font-weight:500;color:var(--roxo2);margin-bottom:5px}
.campo input,.campo select{width:100%;border:1.5px solid var(--borda);border-radius:var(--r);padding:9px 11px;font-size:13px;outline:none;font-family:Inter,sans-serif}
.campo input:focus,.campo select:focus{border-color:var(--roxo)}
.rgm-search{display:flex;gap:8px;margin-bottom:12px}
.rgm-search input{flex:1;border:1.5px solid var(--borda);border-radius:var(--r);padding:8px 12px;font-size:13px;outline:none;font-family:Inter,sans-serif}
@media(max-width:600px){.cgrid{grid-template-columns:1fr 1fr}.painel{padding:16px}.pgrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <h1>Painel ADM</h1>
    <p>Publicidade e Propaganda — UNIGRAN Capital</p>
    <input type="email" id="iEmail" placeholder="E-mail" autocomplete="email">
    <input type="password" id="iSenha" placeholder="Senha">
    <button id="btnE">Entrar</button>
    <p id="erro">E-mail ou senha incorretos.</p>
  </div>
</div>

<div id="app">
  <header>
    <h1>Painel ADM — PP UNIGRAN Capital</h1>
    <div class="header-right">
      <span id="userEmail"></span>
      <button class="btn-sair" id="btnSair">Sair</button>
    </div>
  </header>
  <div class="tabs">
    <div class="tab on" data-aba="estudio">📷 Estúdio</div>
    <div class="tab" data-aba="equipamentos">🎥 Equipamentos</div>
    <div class="tab" data-aba="patrimonio">📦 Patrimônio</div>
    <div class="tab" data-aba="alunos">🎓 Alunos</div>
  </div>
  <div class="painel">
    <div id="estudio"></div>
    <div id="equipamentos" style="display:none"></div>
    <div id="patrimonio" style="display:none"></div>
    <div id="alunos" style="display:none"></div>
  </div>
</div>

<!-- Modal novo/editar equipamento -->
<div class="modal" id="modal">
  <div class="mbox">
    <h2 id="mTitulo">Equipamento</h2>
    <input type="hidden" id="mDocId">
    <div class="campo"><label>Categoria</label><select id="mCat"></select></div>
    <div class="campo"><label>Descrição</label><input type="text" id="mDesc"></div>
    <div class="campo"><label>Marca</label><input type="text" id="mMarca"></div>
    <div class="campo"><label>N. Patrimonial</label><input type="text" id="mPat"></div>
    <div class="campo"><label>Status</label>
      <select id="mStatus">
        <option value="Disponivel">Disponível</option>
        <option value="Emprestado">Emprestado</option>
        <option value="Manutencao">Manutenção</option>
      </select>
    </div>
    <div class="campo">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--roxo2)">
        <input type="checkbox" id="mRestrito" style="width:16px;height:16px;accent-color:var(--roxo)">
        Restrito por RGM
      </label>
      <p style="font-size:11px;color:#6b6b6b;margin-top:4px">Visível apenas para alunos da lista de RGMs autorizados.</p>
    </div>
    <div class="btns">
      <button class="btn broxo" id="bSalv">Salvar</button>
      <button class="btn bno" id="bCan">Cancelar</button>
    </div>
  </div>
</div>

<!-- Modal detalhes equipamento -->
<div class="emodal" id="emodal">
  <div class="emodal-box">
    <div class="emodal-header">
      <span class="emodal-icon" id="emodalIcon"></span>
      <div style="flex:1">
        <div class="emodal-title" id="emodalTitle"></div>
        <div class="emodal-sub" id="emodalSub"></div>
      </div>
      <button onclick="document.getElementById('emodal').classList.remove('on')"
        style="background:none;border:none;font-size:22px;cursor:pointer;color:#6b6b6b;padding:0 4px">×</button>
    </div>
    <div id="emodalPats"></div>
    <div id="emodalBtns" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;border-top:1px solid var(--borda);padding-top:16px"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc,
         deleteDoc, setDoc, getDoc, query, orderBy, getDocs, writeBatch }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const FB  = {
  apiKey: "AIzaSyD2JmP33idYRN6MBsdRzDM65TTZsYBV050",
  authDomain: "ppuncapital-solicitacoes.firebaseapp.com",
  projectId: "ppuncapital-solicitacoes",
  storageBucket: "ppuncapital-solicitacoes.firebasestorage.app",
  messagingSenderId: "317827844767",
  appId: "1:317827844767:web:241de43cc89084232230aa"
};
const SU  = "https://script.google.com/macros/s/AKfycbx0ib88rEgwl9Th_O5VHs_OCY9CswSgXjwxNG3FEmoyZEWoZsCYX5E59O-IWFQvrEz_/exec";
const app = initializeApp(FB);
const auth = getAuth(app);
const db   = getFirestore(app);
console.log("Firebase inicializado:", app.name);

const ICONES = {"Câmera":"📷","Câmera de Foto":"📷","Câmera de Vídeo":"🎬","Lente":"🔭",
  "Iluminação":"💡","Microfone":"🎙️","Tripés/Estabilizadores":"🎯","Gimbal":"🎯",
  "Tripé":"🎯","Cartão de Memória":"💾","Bateria":"🔋","Carregador":"🔌","Leitor de Cartão":"💿"};

var ABA = "estudio";
var CATS = [];
var _todosAlunos = [];

// ── AUTH ──────────────────────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("userEmail").textContent = user.email;
    iniciar();
  } else {
    document.getElementById("login").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }
});

// Registrar eventos após DOM pronto
function registrarEventos() {
  const btnE = document.getElementById("btnE");
  const iSenha = document.getElementById("iSenha");
  const btnSair = document.getElementById("btnSair");
  if (!btnE) { console.error("btnE não encontrado!"); return; }
  console.log("Registrando eventos de login...");
  btnE.addEventListener("click", function() {
    const email = document.getElementById("iEmail").value;
    const senha = document.getElementById("iSenha").value;
    console.log("Login tentativa:", email);
    document.getElementById("erro").style.display = "none";
    setPersistence(auth, browserLocalPersistence)
      .then(() => signInWithEmailAndPassword(auth, email, senha))
      .catch((err) => {
        console.error("Erro login:", err.code, err.message);
        document.getElementById("erro").style.display = "block";
        document.getElementById("erro").textContent = "Erro: " + err.code;
      });
  });
  if (iSenha) iSenha.addEventListener("keydown", e => { if (e.key === "Enter") btnE.click(); });
  if (btnSair) btnSair.addEventListener("click", () => signOut(auth));
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", registrarEventos);
} else {
  registrarEventos();
}

// ── ABAS ──────────────────────────────────────────────────────────────
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = function() {
    ABA = this.dataset.aba;
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
    this.classList.add("on");
    ["estudio","equipamentos","patrimonio","alunos"].forEach(id => {
      document.getElementById(id).style.display = id === ABA ? "block" : "none";
    });
  };
});

// ── LISTENERS ─────────────────────────────────────────────────────────
function iniciar() {
  onSnapshot(query(collection(db,"solicitacoes"), orderBy("enviadoEm","desc")), snap => {
    const docs = []; snap.forEach(d => docs.push({id:d.id,...d.data()}));
    renderEstudio(docs);
  });
  onSnapshot(query(collection(db,"emprestimos"), orderBy("enviadoEm","desc")), snap => {
    const docs = []; snap.forEach(d => docs.push({id:d.id,...d.data()}));
    renderEquipamentos(docs);
  });
  onSnapshot(collection(db,"patrimonio"), snap => {
    const docs = []; snap.forEach(d => docs.push({id:d.id,...d.data()}));
    CATS = [...new Set(docs.map(d => d.categoria))].filter(Boolean).sort();
    popularSelectCat();
    renderPatrimonio(docs);
  });
  onSnapshot(collection(db,"alunos"), snap => {
    const docs = []; snap.forEach(d => docs.push({id:d.id,...d.data()}));
    _todosAlunos = docs;
    renderAlunos(docs);
  });
  onSnapshot(doc(db,"config","status"), snap => {
    if (!snap.exists()) return;
    const d = snap.data();
    const ckEst = document.getElementById("ckEst"); if (ckEst) ckEst.checked = d.estudioAtivo !== false;
    const ckEq  = document.getElementById("ckEq");  if (ckEq)  ckEq.checked  = d.equipAtivo  !== false;
    const me = document.getElementById("msgEst"); if (me) me.value = d.msgEstudio||"";
    const mq = document.getElementById("msgEq");  if (mq) mq.value = d.msgEquip||"";
  });
}

// ── HELPERS ───────────────────────────────────────────────────────────
function mkCard(nome, sub, status, dets, btnsEl) {
  const c = document.createElement("div"); c.className = "card";
  const top = document.createElement("div"); top.className = "ctop";
  const inf = document.createElement("div");
  inf.innerHTML = `<div class="cnome">${nome}</div><div class="csub">${sub}</div>`;
  const b = document.createElement("span");
  b.className = "badge " + status.toLowerCase(); b.textContent = status;
  top.appendChild(inf); top.appendChild(b); c.appendChild(top);
  const g = document.createElement("div"); g.className = "cgrid";
  dets.forEach(([lbl, val]) => {
    const el = document.createElement("div"); el.className = "det";
    el.innerHTML = `<strong>${lbl}</strong>${val||"—"}`; g.appendChild(el);
  });
  c.appendChild(g);
  if (btnsEl) c.appendChild(btnsEl);
  return c;
}

function mkBtns(lista) {
  const d = document.createElement("div"); d.className = "btns";
  lista.forEach(b => {
    const el = document.createElement(b.href ? "a" : "button");
    el.className = "btn " + b.cls; el.textContent = b.label;
    if (b.href) { el.href = b.href; el.target = "_blank"; }
    else el.onclick = b.fn;
    d.appendChild(el);
  });
  return d;
}

function renderSec(cid, titulo, itens, mkFn) {
  const el = document.getElementById(cid);
  const p = document.createElement("p"); p.className = "st";
  p.textContent = `${titulo} (${itens.length})`; el.appendChild(p);
  if (!itens.length) {
    const v = document.createElement("div"); v.className = "vazio";
    v.textContent = "Nenhum registro."; el.appendChild(v); return;
  }
  itens.forEach(s => el.appendChild(mkFn(s)));
}

// ── ESTÚDIO ───────────────────────────────────────────────────────────
function renderEstudio(docs) {
  const el = document.getElementById("estudio"); el.innerHTML = "";
  const pend = docs.filter(s => s.status === "Pendente");
  const apr  = docs.filter(s => s.status === "Aprovado");
  const rec  = docs.filter(s => s.status === "Recusado");
  renderSec("estudio","Pendentes",pend, s => mkCard(
    `${s.nome||""} — ${s.semestre||""} sem.`,
    `RGM ${s.rgm||""} · ${s.email||""} · ${s.whatsapp||""}`, s.status,
    [["Tipo",s.tipoEstudio],["Data",s.data],["Horário",s.horario],
     ["Finalidade",s.finalidade],["Descrição",s.descricao],
     ["Equipamentos",s.equipamentos],["Participantes",s.participantes]],
    mkBtns([
      {label:"✅ Aprovar", cls:"bok", fn:()=>aprovarEst(s)},
      {label:"❌ Recusar", cls:"bno", fn:()=>recusarEst(s)}
    ])
  ));
  renderSec("estudio","Agendados",apr, s => mkCard(
    `${s.nome||""} — ${s.semestre||""} sem.`, `RGM ${s.rgm||""}`, s.status,
    [["Tipo",s.tipoEstudio],["Data",s.data],["Horário",s.horario]],
    mkBtns([{label:"🖨️ Ver Termo", cls:"broxo", href:`${SU}?acao=termoEstudio&id=${s.firestoreId||s.id}`}])
  ));
  renderSec("estudio","Histórico",rec, s => mkCard(

function renderListaAlunos(docs, container, filtro) {
  container.innerHTML = "";
  const f = filtro.toLowerCase();
  const filtrados = docs.filter(d => !f || (d.nome||"").toLowerCase().includes(f) || (d.rgm||"").includes(f))
    .sort((a,b) => (a.nome||"").localeCompare(b.nome||""));
  if (!filtrados.length) { container.innerHTML = "<div class='vazio'>Nenhum aluno encontrado.</div>"; return; }
  const sems = {};
  filtrados.forEach(d => { const s = d.semestre||"?"; if(!sems[s]) sems[s]=[]; sems[s].push(d); });
  Object.keys(sems).sort().forEach(sem => {
    const t = document.createElement("p"); t.className = "st";
    t.textContent = `${sem}º Semestre (${sems[sem].length})`; container.appendChild(t);
    const grid = document.createElement("div"); grid.className = "agrid";
    sems[sem].forEach(d => {
      const c = document.createElement("div");
      c.className = "acard" + (d.bloqueado?" bloqueado":"");
      c.innerHTML = `<h3>${d.nome||""}</h3><p>RGM: <strong>${d.rgm||""}</strong></p><p>E-mail: ${(d.rgm||"") + "@alunos.unigrancapital.com.br"}</p>`;
      const badge = document.createElement("span"); badge.className = d.bloqueado?"semp":"sdisp";
      badge.textContent = d.bloqueado?"🚫 Bloqueado":"✅ Ativo"; badge.style.marginTop="8px";
      c.appendChild(badge);
      const abtns = document.createElement("div"); abtns.className = "abtns";
      if (d.bloqueado) {
        const bL = document.createElement("button"); bL.className = "btn bok"; bL.style.cssText="font-size:12px;padding:5px 12px"; bL.textContent="Liberar";
        bL.onclick = () => toggleBloqueio(d.id, false); abtns.appendChild(bL);
      } else {
        const bB = document.createElement("button"); bB.className = "btn bverm"; bB.style.cssText="font-size:12px;padding:5px 12px"; bB.textContent="Bloquear";
        bB.onclick = () => toggleBloqueio(d.id, true); abtns.appendChild(bB);
      }
      const bDel = document.createElement("button"); bDel.className = "btn bno"; bDel.style.cssText="font-size:12px;padding:5px 12px"; bDel.textContent="Remover";
      bDel.onclick = () => { if(confirm(`Remover ${d.nome}?`)) deleteDoc(doc(db,"alunos",d.id)); };
      abtns.appendChild(bDel); c.appendChild(abtns); grid.appendChild(c);
    });
    container.appendChild(grid);
  });
}

window.importarAlunos = async function(inputEl) {
  const file = inputEl.files[0]; if (!file) { alert("Selecione um arquivo .xlsx"); return; }
  if (!window.XLSX) await carregarXLSX();
  const reader = new FileReader();
  reader.onload = async function(e) {
    const data = new Uint8Array(e.target.result);
    const wb = XLSX.read(data,{type:"array"}); const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws,{header:1}); const header = rows[0]||[];
    const rgmCol=header.findIndex(h=>String(h).toUpperCase().includes("RGM"));
    const nomeCol=header.findIndex(h=>String(h).toUpperCase().includes("NOME"));
    const semCol=header.findIndex(h=>String(h).toUpperCase().includes("SEMESTRE"));
    if (rgmCol<0) { alert("Coluna RGM não encontrada."); return; }
    const batch = writeBatch(db); let count=0;
    rows.slice(1).forEach(row => {
      const rgm=String(row[rgmCol]||"").trim(); if(!rgm) return;
      const nome=(nomeCol>=0?String(row[nomeCol]||""):"").split(" ").map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" ");
      const sem=semCol>=0?String(row[semCol]||""):"";
      batch.set(doc(collection(db,"alunos")),{rgm,nome,semestre:sem,bloqueado:false}); count++;
    });
    await batch.commit(); alert(count+" alunos importados!");
  };
  reader.readAsArrayBuffer(file);
};

window.importarRGMs = async function(inputEl) {
  const file = inputEl.files[0]; if (!file) { alert("Selecione um arquivo .xlsx"); return; }
  if (!window.XLSX) await carregarXLSX();
  const reader = new FileReader();
  reader.onload = async function(e) {
    const data = new Uint8Array(e.target.result);
    const wb = XLSX.read(data,{type:"array"}); const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws,{header:1}); const header = rows[0]||[];
    const rgmCol=header.findIndex(h=>String(h).toUpperCase().includes("RGM"));
    if (rgmCol<0) { alert("Coluna RGM não encontrada."); return; }
    const rgms=rows.slice(1).map(r=>String(r[rgmCol]||"").trim()).filter(r=>r);
    await setDoc(doc(db,"config","rgms4sem"),{rgms,atualizadoEm:new Date().toISOString()});
    document.getElementById("rgmCount").textContent = rgms.length+" RGMs autorizados.";
