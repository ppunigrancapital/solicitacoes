<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel ADM | PP UNIGRAN</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Firebase Compat -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--roxo:#6a1e9a;--roxo2:#4a1270;--fundo:#f4f1f8;--borda:#ddd0ea;--r:8px;--verde:#2d7a2d}
body{background:var(--fundo);font-family:Inter,sans-serif;font-size:14px;color:#1a1a1a;min-height:100vh}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.lbox{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:40px;width:100%;max-width:360px;text-align:center}
.lbox h1{font-size:20px;color:var(--roxo2);margin-bottom:8px}
.lbox p{color:#6b6b6b;font-size:13px;margin-bottom:24px}
.lbox input{width:100%;border:1.5px solid var(--borda);border-radius:var(--r);padding:10px 12px;font-size:14px;outline:none;margin-bottom:12px;font-family:Inter,sans-serif}
.lbox input:focus{border-color:var(--roxo)}
.lbox button{width:100%;background:var(--roxo);color:#fff;border:none;border-radius:var(--r);padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif}
#erro{color:#c0392b;font-size:12px;margin-top:10px;display:none}
#app{display:none}
header{background:var(--roxo2);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:16px;font-weight:700}
.header-right{display:flex;align-items:center;gap:16px}
header span{font-size:12px;opacity:.7}
.btn-sair{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:var(--r);padding:6px 14px;font-size:12px;cursor:pointer;font-family:Inter,sans-serif}
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--borda);padding:0 24px;overflow-x:auto}
.tab{padding:14px 20px;cursor:pointer;font-size:13px;font-weight:500;color:#6b6b6b;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--roxo);border-bottom-color:var(--roxo);font-weight:600}
.painel{padding:24px;max-width:1100px;margin:0 auto}
.st{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--roxo2);margin:24px 0 10px;clear:both}
.st:first-child{margin-top:0}
.card{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:20px;margin-bottom:12px}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.cnome{font-weight:600;font-size:15px}.csub{font-size:12px;color:#6b6b6b;margin-top:2px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
.pendente{background:#fff3cd;color:#856404}.aprovado{background:#d4edda;color:#155724}.recusado{background:#f8d7da;color:#721c24}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:14px}
.det{font-size:12px}.det strong{display:block;color:var(--roxo2);font-size:11px;margin-bottom:2px}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{padding:8px 18px;border-radius:var(--r);border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:Inter,sans-serif;text-decoration:none;display:inline-block}
.bok{background:var(--verde);color:#fff}.bno{background:#eee;color:#333}.broxo{background:var(--roxo);color:#fff}.bverm{background:#c0392b;color:#fff}
.vazio{text-align:center;color:#6b6b6b;padding:40px;font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.ecard{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:16px 10px;text-align:center;cursor:pointer;transition:all .15s;position:relative}
.ecard:hover{border-color:var(--roxo);box-shadow:0 2px 12px rgba(106,30,154,.15);transform:translateY(-2px)}
.ecard-icon{font-size:30px;margin-bottom:8px;display:block}
.ecard-nome{font-size:12px;font-weight:600;color:#1a1a1a;line-height:1.3;margin-bottom:3px}
.ecard-info{font-size:11px;color:#6b6b6b}
.ecard-badge{position:absolute;top:6px;right:6px;background:var(--roxo);color:#fff;border-radius:20px;padding:1px 7px;font-size:10px;font-weight:700}
.ecard-restrito{position:absolute;top:6px;left:6px;font-size:11px}
.emodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px}
.emodal.on{display:flex}
.emodal-box{background:#fff;border-radius:var(--r);padding:28px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
.emodal-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.emodal-icon{font-size:36px}.emodal-title{font-size:17px;font-weight:700;color:var(--roxo2)}.emodal-sub{font-size:12px;color:#6b6b6b;margin-top:2px}
.pat-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.pat-num{font-size:11px;color:var(--roxo2);font-weight:700;min-width:20px}
.pat-inp{flex:1;border:1.5px solid var(--borda);border-radius:6px;padding:6px 10px;font-size:13px;outline:none;font-family:Inter,sans-serif}
.pat-inp:focus{border-color:var(--roxo)}
.pat-status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;cursor:pointer;white-space:nowrap;border:none}
.pat-del{background:#fde;color:#c0392b;border:none;border-radius:4px;padding:3px 8px;cursor:pointer;font-weight:700;font-size:13px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.acard{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:14px;border-left:4px solid var(--verde)}
.acard.bloqueado{border-left-color:#c0392b}
.acard h3{font-size:13px;font-weight:600;margin-bottom:4px}
.acard p{font-size:12px;color:#6b6b6b;margin-bottom:2px}
.acard .abtns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.cfg{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:20px;margin-bottom:20px}
.cfg h3{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--roxo2);margin-bottom:14px;letter-spacing:.08em}
.sw{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;cursor:pointer}
.sw input{width:16px;height:16px;accent-color:var(--roxo)}
.cmsg{width:100%;border:1.5px solid var(--borda);border-radius:var(--r);padding:8px 10px;font-size:13px;min-height:60px;resize:vertical;margin-bottom:10px;font-family:Inter,sans-serif}
.abtn{background:var(--roxo);color:#fff;border:none;border-radius:var(--r);padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px;font-family:Inter,sans-serif;margin-right:8px}
.cats-box{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:16px;margin-bottom:16px}
.cats-box h3{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--roxo2);margin-bottom:12px;letter-spacing:.08em}
.cat-tag{display:inline-flex;align-items:center;gap:4px;background:#f4f1f8;border:1px solid var(--borda);border-radius:20px;padding:4px 10px;font-size:12px;margin:4px}
.cat-tag button{background:none;border:none;cursor:pointer;font-size:12px;padding:0 2px}
.cat-tag .cat-del{color:#c0392b}.cat-tag .cat-edit{color:#4a1270}
.cat-input-row{display:flex;gap:8px;margin-top:10px}
.cat-input-row input{flex:1;border:1.5px solid var(--borda);border-radius:var(--r);padding:8px 10px;font-size:13px;outline:none;font-family:Inter,sans-serif}
.cat-input-row button{background:var(--roxo);color:#fff;border:none;border-radius:var(--r);padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
.sdisp{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#d4edda;color:#155724}
.semp{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#f8d7da;color:#721c24}
.smanut{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#fff3cd;color:#856404}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:var(--r);padding:28px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.mbox h2{font-size:16px;color:var(--roxo2);margin-bottom:20px}
.campo{margin-bottom:14px}.campo label{display:block;font-size:12px;font-weight:500;color:var(--roxo2);margin-bottom:5px}
.campo input,.campo select{width:100%;border:1.5px solid var(--borda);border-radius:var(--r);padding:9px 11px;font-size:13px;outline:none;font-family:Inter,sans-serif}
.campo input:focus,.campo select:focus{border-color:var(--roxo)}
@media(max-width:600px){.cgrid{grid-template-columns:1fr 1fr}.painel{padding:16px}.pgrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <h1>Painel ADM</h1>
    <p>Publicidade e Propaganda — UNIGRAN Capital</p>
    <input type="email" id="iEmail" placeholder="E-mail" autocomplete="email">
    <input type="password" id="iSenha" placeholder="Senha">
    <button onclick="entrar()">Entrar</button>
    <p id="erro"></p>
  </div>
</div>

<div id="app">
  <header>
    <h1>Painel ADM — PP UNIGRAN Capital</h1>
    <div class="header-right">
      <span id="userEmail"></span>
      <button class="btn-sair" onclick="firebase.auth().signOut()">Sair</button>
    </div>
  </header>
  <div class="tabs">
    <div class="tab on" onclick="mudarAba('estudio',this)">📷 Estúdio</div>
    <div class="tab" onclick="mudarAba('equipamentos',this)">🎥 Equipamentos</div>
    <div class="tab" onclick="mudarAba('patrimonio',this)">📦 Patrimônio</div>
    <div class="tab" onclick="mudarAba('alunos',this)">🎓 Alunos</div>
  </div>
  <div class="painel">
    <div id="estudio"></div>
    <div id="equipamentos" style="display:none"></div>
    <div id="patrimonio" style="display:none"></div>
    <div id="alunos" style="display:none"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <h2 id="mTitulo">Equipamento</h2>
    <input type="hidden" id="mDocId">
    <div class="campo"><label>Categoria</label><select id="mCat"></select></div>
    <div class="campo"><label>Descrição</label><input type="text" id="mDesc"></div>
    <div class="campo"><label>Marca</label><input type="text" id="mMarca"></div>
    <div class="campo"><label>N. Patrimonial</label><input type="text" id="mPat"></div>
    <div class="campo"><label>Status</label>
      <select id="mStatus">
        <option value="Disponivel">Disponível</option>
        <option value="Emprestado">Emprestado</option>
        <option value="Manutencao">Manutenção</option>
      </select>
    </div>
    <div class="campo">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
        <input type="checkbox" id="mRestrito" style="width:16px;height:16px;accent-color:var(--roxo)">
        Restrito por RGM
      </label>
    </div>
    <div class="btns">
      <button class="btn broxo" onclick="salvarEquip()">Salvar</button>
      <button class="btn bno" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>

<div class="emodal" id="emodal">
  <div class="emodal-box">
    <div class="emodal-header">
      <span class="emodal-icon" id="emodalIcon"></span>
      <div style="flex:1">
        <div class="emodal-title" id="emodalTitle"></div>
        <div class="emodal-sub" id="emodalSub"></div>
      </div>
      <button onclick="document.getElementById('emodal').classList.remove('on')"
        style="background:none;border:none;font-size:22px;cursor:pointer;color:#6b6b6b;padding:0 4px">×</button>
    </div>
    <div id="emodalPats"></div>
    <div id="emodalBtns" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;border-top:1px solid var(--borda);padding-top:16px"></div>
  </div>
</div>

<script>
var SU = "https://script.google.com/macros/s/AKfycbx0ib88rEgwl9Th_O5VHs_OCY9CswSgXjwxNG3FEmoyZEWoZsCYX5E59O-IWFQvrEz_/exec";
var ICONES = {"Câmera":"📷","Câmera de Foto":"📷","Câmera de Vídeo":"🎬","Lente":"🔭",
  "Iluminação":"💡","Microfone":"🎙️","Tripés/Estabilizadores":"🎯","Gimbal":"🎯",
  "Tripé":"🎯","Cartão de Memória":"💾","Bateria":"🔋","Carregador":"🔌","Leitor de Cartão":"💿"};
var CATS = [];
var _todosAlunos = [];
var _unsubscribers = [];
var db, auth;

// Init Firebase
firebase.initializeApp({"apiKey":"AIzaSyD2JmP33idYRN6MBsdRzDM65TTZsYBV050","authDomain":"ppuncapital-solicitacoes.firebaseapp.com","projectId":"ppuncapital-solicitacoes","storageBucket":"ppuncapital-solicitacoes.firebasestorage.app","messagingSenderId":"317827844767","appId":"1:317827844767:web:241de43cc89084232230aa"});
auth = firebase.auth();
db   = firebase.firestore();

// Auth state
firebase.auth().onAuthStateChanged(function(user) {
  if (user) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('userEmail').textContent = user.email;
    iniciar();
  } else {
    document.getElementById('login').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    _unsubscribers.forEach(function(u){ u(); });
    _unsubscribers = [];
  }
});

function entrar() {
  var email = document.getElementById('iEmail').value.trim();
  var senha = document.getElementById('iSenha').value;
  var erroEl = document.getElementById('erro');
  erroEl.style.display = 'none';
  if (!email || !senha) { erroEl.style.display='block'; erroEl.textContent='Preencha e-mail e senha.'; return; }
  firebase.auth().signInWithEmailAndPassword(email, senha)
    .catch(function(err) {
      erroEl.style.display = 'block';
      erroEl.textContent = err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential'
        ? 'Senha incorreta.' : err.code === 'auth/user-not-found' ? 'E-mail não encontrado.' : 'Erro: ' + err.code;
    });
}

function mudarAba(aba, el) {
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('on'); });
  el.classList.add('on');
  ['estudio','equipamentos','patrimonio','alunos'].forEach(function(id){
    document.getElementById(id).style.display = id === aba ? 'block' : 'none';
  });
}

function iniciar() {
  var u1 = db.collection('solicitacoes').orderBy('enviadoEm','desc').onSnapshot(function(snap) {
    var docs = []; snap.forEach(function(d){ docs.push(Object.assign({id:d.id},d.data())); });
    renderEstudio(docs);
  });
  var u2 = db.collection('emprestimos').orderBy('enviadoEm','desc').onSnapshot(function(snap) {
    var docs = []; snap.forEach(function(d){ docs.push(Object.assign({id:d.id},d.data())); });
    renderEquipamentos(docs);
  });
  var u3 = db.collection('patrimonio').onSnapshot(function(snap) {
    var docs = []; snap.forEach(function(d){ docs.push(Object.assign({id:d.id},d.data())); });
    CATS = [...new Set(docs.map(function(d){ return d.categoria; }))].filter(Boolean).sort();
    popularSelectCat();
    renderPatrimonio(docs);
  });
  var u4 = db.collection('alunos').onSnapshot(function(snap) {
    var docs = []; snap.forEach(function(d){ docs.push(Object.assign({id:d.id},d.data())); });
    _todosAlunos = docs;
    renderAlunos(docs);
  });
  var u5 = db.collection('config').doc('status').onSnapshot(function(snap) {
    if (!snap.exists) return;
    var d = snap.data();
    var ckEst=document.getElementById('ckEst'); if(ckEst) ckEst.checked = d.estudioAtivo!==false;
    var ckEq=document.getElementById('ckEq');   if(ckEq)  ckEq.checked  = d.equipAtivo!==false;
    var me=document.getElementById('msgEst');   if(me) me.value = d.msgEstudio||'';
    var mq=document.getElementById('msgEq');    if(mq) mq.value = d.msgEquip||'';
  });
  _unsubscribers = [u1,u2,u3,u4,u5];
}

// ── HELPERS ──────────────────────────────────────────────────────────
function mkCard(nome, sub, status, dets, btnsEl) {
  var c = document.createElement('div'); c.className = 'card';
  var top = document.createElement('div'); top.className = 'ctop';
  var inf = document.createElement('div');
  inf.innerHTML = '<div class="cnome">'+nome+'</div><div class="csub">'+sub+'</div>';
  var b = document.createElement('span');
  b.className = 'badge '+status.toLowerCase(); b.textContent = status;
  top.appendChild(inf); top.appendChild(b); c.appendChild(top);
  var g = document.createElement('div'); g.className = 'cgrid';
  dets.forEach(function(d){
    var el = document.createElement('div'); el.className = 'det';
    el.innerHTML = '<strong>'+d[0]+'</strong>'+(d[1]||'—'); g.appendChild(el);
  });
  c.appendChild(g); if(btnsEl) c.appendChild(btnsEl); return c;
}

function mkBtns(lista) {
  var d = document.createElement('div'); d.className = 'btns';
  lista.forEach(function(b){
    var el = document.createElement(b.href?'a':'button');
    el.className = 'btn '+b.cls; el.textContent = b.label;
    if(b.href){ el.href=b.href; el.target='_blank'; } else el.onclick=b.fn;
    d.appendChild(el);
  });
  return d;
}

function renderSec(cid, titulo, itens, mkFn) {
  var el = document.getElementById(cid);
  var p = document.createElement('p'); p.className = 'st';
  p.textContent = titulo+' ('+itens.length+')'; el.appendChild(p);
  if (!itens.length) { var v=document.createElement('div'); v.className='vazio'; v.textContent='Nenhum registro.'; el.appendChild(v); return; }
  itens.forEach(function(s){ el.appendChild(mkFn(s)); });
}

// ── ESTÚDIO ──────────────────────────────────────────────────────────
function renderEstudio(docs) {
  var el = document.getElementById('estudio'); el.innerHTML = '';
  var pend=docs.filter(function(s){return s.status==='Pendente';});
  var apr=docs.filter(function(s){return s.status==='Aprovado';});
  var rec=docs.filter(function(s){return s.status==='Recusado';});
  renderSec('estudio','Pendentes',pend,function(s){ return mkCard(
    (s.nome||'')+' — '+(s.semestre||'')+' sem.','RGM '+(s.rgm||'')+' · '+(s.email||'')+' · '+(s.whatsapp||''),s.status,
    [['Tipo',s.tipoEstudio],['Data',s.data],['Horário',s.horario],['Finalidade',s.finalidade],['Descrição',s.descricao],['Equipamentos',s.equipamentos],['Participantes',s.participantes]],
    mkBtns([{label:'✅ Aprovar',cls:'bok',fn:function(){aprovarEst(s);}},{label:'❌ Recusar',cls:'bno',fn:function(){recusarEst(s);}}]));
  });
  renderSec('estudio','Agendados',apr,function(s){ return mkCard(
    (s.nome||'')+' — '+(s.semestre||'')+' sem.','RGM '+(s.rgm||''),s.status,
    [['Tipo',s.tipoEstudio],['Data',s.data],['Horário',s.horario]],
    mkBtns([{label:'🖨️ Ver Termo',cls:'broxo',href:SU+'?acao=termoEstudio&id='+(s.firestoreId||s.id)}]));
  });
  renderSec('estudio','Histórico',rec,function(s){ return mkCard(s.nome||'','RGM '+(s.rgm||''),s.status,[['Data',s.data],['Horário',s.horario]],null); });
}
function aprovarEst(s) {
  if(!confirm('Aprovar reserva de '+s.nome+'?')) return;
  db.collection('solicitacoes').doc(s.id).update({status:'Aprovado'});
  fetch(SU+'?acao=aprovar&id='+encodeURIComponent(s.firestoreId||s.id)).catch(function(){});
  alert('Aprovado!');
}
function recusarEst(s) {
  if(!confirm('Recusar reserva de '+s.nome+'?')) return;
  db.collection('solicitacoes').doc(s.id).update({status:'Recusado'});
  fetch(SU+'?acao=recusar&id='+encodeURIComponent(s.firestoreId||s.id)).catch(function(){});
  alert('Recusado.');
}

// ── EQUIPAMENTOS ─────────────────────────────────────────────────────
function renderEquipamentos(docs) {
  var el = document.getElementById('equipamentos'); el.innerHTML = '';
  var pend=docs.filter(function(s){return s.status==='Pendente';});
  var apr=docs.filter(function(s){return s.status==='Aprovado';});
  var rec=docs.filter(function(s){return s.status==='Recusado';});
  renderSec('equipamentos','Pendentes',pend,function(s){ return mkCard(
    s.nome||'','RGM '+(s.rgm||'')+' · '+(s.email||''),s.status,
    [['Retirada',s.dataRetirada],['Devolução',s.dataDevolucao],['Equipamentos',s.equipamentos],['Patrimônios',s.patrimonios]],

    var sc=u.status==='Disponivel'?'sdisp':u.status==='Manutencao'?'smanut':'semp';

    badge.onclick=(function(u,badge){ return function(){
      var prox=u.status==='Disponivel'?'Manutencao':u.status==='Manutencao'?'Emprestado':'Disponivel';

      badge.className='pat-status '+(prox==='Disponivel'?'sdisp':prox==='Manutencao'?'smanut':'semp');
      badge.textContent=prox==='Disponivel'?'OK':prox==='Manutencao'?'Manut.':'Emp.';
    }; })(u,badge);
    var bDel=document.createElement('button'); bDel.className='pat-del'; bDel.textContent='×';
    bDel.onclick=(function(u,unidades,cat,modelo,restrito,icone){ return function(){
      if(confirm('Remover?')){ db.collection('patrimonio').doc(u.id).delete(); abrirEmodal(cat,modelo,unidades.filter(function(x){return x.id!==u.id;}),restrito,icone); }
    }; })(u,unidades,cat,modelo,restrito,icone);
    row.appendChild(num); row.appendChild(inp); row.appendChild(badge); row.appendChild(bDel);
    patsDiv.appendChild(row);
  });

  btnsDiv.appendChild(bAdd); btnsDiv.appendChild(bEdit);

}

function salvarStatus() {
  var ce=document.getElementById('ckEst'), cq=document.getElementById('ckEq');
  var me=document.getElementById('msgEst'), mq=document.getElementById('msgEq');
  db.collection('config').doc('status').set({estudioAtivo:ce?ce.checked:true,msgEstudio:me?me.value:'',equipAtivo:cq?cq.checked:true,msgEquip:mq?mq.value:''});
  alert('Disponibilidade salva!');
}

function renomearCategoria(antigo, novo, docs) {
  if(!confirm('Renomear "'+antigo+'" → "'+novo+'"?')) return;
  var batch=db.batch();
  docs.filter(function(d){return d.categoria===antigo;}).forEach(function(i){ batch.update(db.collection('patrimonio').doc(i.id),{categoria:novo}); });
  batch.commit().then(function(){ alert('Renomeado.'); });
}

function removerCategoria(cat, docs) {
  var itens=docs.filter(function(d){return d.categoria===cat;});
  if(!confirm('Remover "'+cat+'"'+(itens.length?' e seus '+itens.length+' equipamento(s)':'')+' ?')) return;
  var batch=db.batch();
  itens.forEach(function(i){ batch.delete(db.collection('patrimonio').doc(i.id)); });
  batch.commit();
}

function abrirModal(item) {
  document.getElementById('mTitulo').textContent = item&&item.id ? 'Editar Equipamento' : 'Novo Equipamento';
  document.getElementById('mDocId').value  = item&&item.id ? item.id : '';
  document.getElementById('mCat').value    = item ? (item.categoria||(CATS[0]||'')) : (CATS[0]||'');
  document.getElementById('mDesc').value   = item ? (item.descricao||'') : '';
  document.getElementById('mMarca').value  = item ? (item.marca||'') : '';
  document.getElementById('mPat').value    = item ? (item.patrimonio||'') : '';
  document.getElementById('mStatus').value = item ? (item.status||'Disponivel') : 'Disponivel';
  document.getElementById('mRestrito').checked = item ? !!item.restrito4sem : false;
  document.getElementById('modal').classList.add('on');
}

function bloqueioEquipTurma(sem, bloquear) {
  var msg = (bloquear?'Bloquear':'Liberar')+' equipamentos para '+(sem==='Todos'?'todos os semestres':'o '+sem+'º semestre')+'?';
  if (!confirm(msg)) return;
  // Bloquear/liberar os alunos do semestre para equipamentos
  db.collection('alunos').get().then(function(snap) {
    var batch=db.batch();
    var count=0;
    snap.forEach(function(d){
      var aluno=d.data();
      if (sem==='Todos' || String(aluno.semestre)===String(sem)) {
        batch.update(d.ref, {equipBloqueado: bloquear});
        count++;
      }
    });
    batch.commit().then(function(){ alert(count+' alunos '+(bloquear?'bloqueados':'liberados')+' para equipamentos.'); });
  });
}

function fecharModal() { document.getElementById('modal').classList.remove('on'); }

function salvarEquip() {
  var id=document.getElementById('mDocId').value;
  var data={categoria:document.getElementById('mCat').value,descricao:document.getElementById('mDesc').value,
    marca:document.getElementById('mMarca').value,patrimonio:document.getElementById('mPat').value,
    status:document.getElementById('mStatus').value,restrito4sem:document.getElementById('mRestrito').checked};
  if(id) db.collection('patrimonio').doc(id).update(data);
  else   db.collection('patrimonio').add(data);
  fecharModal();
}

function renderListaAlunos(docs, container, filtro) {
  container.innerHTML='';
  var f=filtro.toLowerCase();
  var filtrados=docs.filter(function(d){return !f||((d.nome||'').toLowerCase().includes(f))||(d.rgm||'').includes(f);})
    .sort(function(a,b){return (a.nome||'').localeCompare(b.nome||'');});
  if(!filtrados.length){container.innerHTML="<div class='vazio'>Nenhum aluno encontrado.</div>";return;}
  var sems={};
  filtrados.forEach(function(d){var s=d.semestre||'?'; if(!sems[s]) sems[s]=[]; sems[s].push(d);});
  Object.keys(sems).sort().forEach(function(sem){
    var t=document.createElement('p'); t.className='st'; t.textContent=sem+'º Semestre ('+sems[sem].length+')'; container.appendChild(t);
    var grid=document.createElement('div'); grid.className='agrid';
    sems[sem].forEach(function(d){
      var c=document.createElement('div'); c.className='acard'+(d.bloqueado?' bloqueado':'');
      // Nome editável
      var nomeEl=document.createElement('input');
      nomeEl.value=d.nome||'';
      nomeEl.style.cssText='width:100%;border:none;border-bottom:1px solid var(--borda);font-size:13px;font-weight:600;padding:2px 0;margin-bottom:6px;outline:none;font-family:Inter,sans-serif;background:transparent';
      nomeEl.onblur=function(){ if(this.value!==d.nome){ db.collection('alunos').doc(d.id).update({nome:this.value}); d.nome=this.value; } };

      // RGM editável
      var rgmRow=document.createElement('div'); rgmRow.style.cssText='display:flex;align-items:center;gap:4px;margin-bottom:2px';
      var rgmLbl=document.createElement('span'); rgmLbl.style.cssText='font-size:12px;color:#6b6b6b'; rgmLbl.textContent='RGM: ';
      var rgmEl=document.createElement('input'); rgmEl.value=d.rgm||'';
      rgmEl.style.cssText='border:none;border-bottom:1px solid var(--borda);font-size:12px;font-weight:600;padding:1px 0;outline:none;font-family:Inter,sans-serif;background:transparent;width:80px';
      rgmEl.onblur=function(){ if(this.value!==d.rgm){ db.collection('alunos').doc(d.id).update({rgm:this.value}); d.rgm=this.value; } };
      rgmRow.appendChild(rgmLbl); rgmRow.appendChild(rgmEl);

      var emailP=document.createElement('p'); emailP.style.cssText='font-size:11px;color:#6b6b6b;margin-bottom:2px';
      emailP.textContent=(d.rgm||'')+'@alunos.unigrancapital.com.br';

      c.appendChild(nomeEl); c.appendChild(rgmRow); c.appendChild(emailP);
      var badge=document.createElement('span'); badge.className=d.bloqueado?'semp':'sdisp';
      badge.textContent=d.bloqueado?'🚫 Bloqueado':'✅ Ativo'; badge.style.marginTop='8px'; badge.style.display='inline-block';
      c.appendChild(badge);
      var abtns=document.createElement('div'); abtns.className='abtns';
      if(d.bloqueado){var bL=document.createElement('button');bL.className='btn bok';bL.style.cssText='font-size:12px;padding:5px 12px';bL.textContent='Liberar';bL.onclick=(function(d){return function(){db.collection('alunos').doc(d.id).update({bloqueado:false});};})(d);abtns.appendChild(bL);}
      else{var bB=document.createElement('button');bB.className='btn bverm';bB.style.cssText='font-size:12px;padding:5px 12px';bB.textContent='Bloquear';bB.onclick=(function(d){return function(){db.collection('alunos').doc(d.id).update({bloqueado:true});};})(d);abtns.appendChild(bB);}
      var bDel=document.createElement('button');bDel.className='btn bno';bDel.style.cssText='font-size:12px;padding:5px 12px';bDel.textContent='Remover';
      bDel.onclick=(function(d){return function(){if(confirm('Remover '+d.nome+'?')) db.collection('alunos').doc(d.id).delete();};})(d);
      abtns.appendChild(bDel); c.appendChild(abtns); grid.appendChild(c);
    });
    container.appendChild(grid);
  });
}

function toggleTodos(docs, bloquear) {
  if(!confirm(bloquear?'Bloquear TODOS?':'Liberar TODOS?')) return;
  var batch=db.batch();
  docs.forEach(function(d){batch.update(db.collection('alunos').doc(d.id),{bloqueado:bloquear});});
  batch.commit().then(function(){alert('Feito!');});
}

function toggleSemestre(docs, sem, bloquear) {
  var filtrados=docs.filter(function(d){return String(d.semestre)===String(sem);});
  if(!filtrados.length){alert('Nenhum aluno no '+sem+'º semestre.');return;}
  if(!confirm((bloquear?'Bloquear':'Liberar')+' '+filtrados.length+' alunos do '+sem+'º semestre?')) return;
  var batch=db.batch();
  filtrados.forEach(function(d){batch.update(db.collection('alunos').doc(d.id),{bloqueado:bloquear});});
  batch.commit().then(function(){alert('Feito!');});
}

function carregarXLSX(cb) {
  if(window.XLSX){cb();return;}
  var s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

function importarAlunos(inputEl) {
  var file=inputEl.files[0]; if(!file){alert('Selecione um arquivo .xlsx');return;}
  carregarXLSX(function(){
    var reader=new FileReader();
    reader.onload=function(e){
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array'}); var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1}); var header=rows[0]||[];
      var rgmCol=header.findIndex(function(h){return String(h).toUpperCase().includes('RGM');});
      var nomeCol=header.findIndex(function(h){return String(h).toUpperCase().includes('NOME');});
      var semCol=header.findIndex(function(h){return String(h).toUpperCase().includes('SEMESTRE');});
      if(rgmCol<0){alert('Coluna RGM não encontrada.');return;}
      var batch=db.batch(); var count=0;
      rows.slice(1).forEach(function(row){
        var rgm=String(row[rgmCol]||'').trim(); if(!rgm) return;
        var nome=(nomeCol>=0?String(row[nomeCol]||''):'').split(' ').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();}).join(' ');
        var sem=semCol>=0?String(row[semCol]||''):'';
        batch.set(db.collection('alunos').doc(),{rgm:rgm,nome:nome,semestre:sem,bloqueado:false}); count++;
      });
      batch.commit().then(function(){alert(count+' alunos importados!');});
    };
    reader.readAsArrayBuffer(file);
  });
}

function importarRGMs(inputEl) {
  var file=inputEl.files[0]; if(!file){alert('Selecione um arquivo .xlsx');return;}
  carregarXLSX(function(){
    var reader=new FileReader();
    reader.onload=function(e){
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array'}); var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1}); var header=rows[0]||[];
      var rgmCol=header.findIndex(function(h){return String(h).toUpperCase().includes('RGM');});
      if(rgmCol<0){alert('Coluna RGM não encontrada.');return;}
      var rgms=rows.slice(1).map(function(r){return String(r[rgmCol]||'').trim();}).filter(function(r){return r;});
      db.collection('config').doc('rgms4sem').set({rgms:rgms,atualizadoEm:new Date().toISOString()}).then(function(){
        document.getElementById('rgmCount').textContent=rgms.length+' RGMs autorizados.';
        alert(rgms.length+' RGMs importados!');
      });
    };
    reader.readAsArrayBuffer(file);
  });
}
