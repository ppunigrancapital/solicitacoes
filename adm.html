<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:14px}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:24px}.cat-section{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:16px}.cat-section-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--roxo2);margin-bottom:12px}.cat-cards{display:flex;flex-direction:column;gap:8px}.ecard{background:var(--fundo);border:1px solid var(--borda);border-radius:6px;padding:10px;text-align:center;cursor:pointer;transition:all .15s;position:relative}.ecard:hover{border-color:var(--roxo);box-shadow:0 2px 8px rgba(106,30,154,.12)}.ecard-icon{font-size:22px;margin-bottom:4px;display:block}.ecard-nome{font-size:12px;font-weight:600;color:#1a1a1a;line-height:1.3}.ecard-info{font-size:10px;color:#6b6b6b;margin-top:2px}.ecard-badge{position:absolute;top:5px;right:5px;background:var(--roxo);color:#fff;border-radius:20px;padding:1px 6px;font-size:10px;font-weight:700}.ecard-restrito{position:absolute;top:5px;left:5px;font-size:10px}

.acard{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:14px;border-left:4px solid var(--verde)}

.acard .abtns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.cfg{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:20px;margin-bottom:20px}
.cfg h3{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--roxo2);margin-bottom:14px;letter-spacing:.08em}
.sw{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;cursor:pointer}
.sw input{width:16px;height:16px;accent-color:var(--roxo)}
.cmsg{width:100%;border:1.5px solid var(--borda);border-radius:var(--r);padding:8px 10px;font-size:13px;min-height:60px;resize:vertical;margin-bottom:10px;font-family:Inter,sans-serif}
.abtn{background:var(--roxo);color:#fff;border:none;border-radius:var(--r);padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px;font-family:Inter,sans-serif;margin-right:8px}
.cats-box{background:#fff;border:1px solid var(--borda);border-radius:var(--r);padding:16px;margin-bottom:16px}
.cats-box h3{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--roxo2);margin-bottom:12px;letter-spacing:.08em}
.cat-tag{display:inline-flex;align-items:center;gap:4px;background:#f4f1f8;border:1px solid var(--borda);border-radius:20px;padding:4px 10px;font-size:12px;margin:4px}

.cat-tag .cat-del{color:#c0392b}.cat-tag .cat-edit{color:#4a1270}
.cat-input-row{display:flex;gap:8px;margin-top:10px}
.cat-input-row input{flex:1;border:1.5px solid var(--borda);border-radius:var(--r);padding:8px 10px;font-size:13px;outline:none;font-family:Inter,sans-serif}
.cat-input-row button{background:var(--roxo);color:#fff;border:none;border-radius:var(--r);padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
.sdisp{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#d4edda;color:#155724}
.semp{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#f8d7da;color:#721c24}
.smanut{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;background:#fff3cd;color:#856404}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:var(--r);padding:28px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
.mbox h2{font-size:16px;color:var(--roxo2);margin-bottom:20px}
.campo{margin-bottom:14px}.campo label{display:block;font-size:12px;font-weight:500;color:var(--roxo2);margin-bottom:5px}
.campo input,.campo select{width:100%;border:1.5px solid var(--borda);border-radius:var(--r);padding:9px 11px;font-size:13px;outline:none;font-family:Inter,sans-serif}
.campo input:focus,.campo select:focus{border-color:var(--roxo)}
.cancelado{background:#e2e3e5;color:#383d41}.bicon{padding:8px 12px}
@media(max-width:700px){header{padding:12px 16px}.tabs{padding:0 8px}.tab{padding:12px 14px}.cgrid{grid-template-columns:1fr}.btns .btn{flex:1 1 calc(50% - 8px);text-align:center;padding:12px 10px}.btns .btn.bicon{flex:0 0 auto}.acard .abtns .btn{flex:1;padding:9px 10px!important}.mbox,.emodal-box{padding:18px}.header-right{gap:10px}input,select,textarea{font-size:16px!important}#ctlLista{overflow-x:auto}.painel{padding:12px}}
@media(max-width:600px){.cgrid{grid-template-columns:1fr 1fr}.painel{padding:16px}.cat-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
</style>

var ICONES = {"Câmera":"📷","Câmera de Foto":"📷","Câmera de Vídeo":"🎬","Lente":"🔭",
  "Iluminação":"💡","Microfone":"🎙️","Tripés/Estabilizadores":"🎯","Gimbal":"🎯",

var CATS = [];
var _todosAlunos = [];
var _unsubscribers = [];

// Init Firebase
firebase.initializeApp({"apiKey":"AIzaSyD2JmP33idYRN6MBsdRzDM65TTZsYBV050","authDomain":"ppuncapital-solicitacoes.firebaseapp.com","projectId":"ppuncapital-solicitacoes","storageBucket":"ppuncapital-solicitacoes.firebasestorage.app","messagingSenderId":"317827844767","appId":"1:317827844767:web:241de43cc89084232230aa"});
auth = firebase.auth();

// Auth state
firebase.auth().onAuthStateChanged(function(user) {
  if (user) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('userEmail').textContent = user.email;
    iniciar();
  } else {
    document.getElementById('login').style.display = 'flex';

function entrar() {
  var email = document.getElementById('iEmail').value.trim();
  var senha = document.getElementById('iSenha').value;
  var erroEl = document.getElementById('erro');
  erroEl.style.display = 'none';
  if (!email || !senha) { erroEl.style.display='block'; erroEl.textContent='Preencha e-mail e senha.'; return; }
  firebase.auth().signInWithEmailAndPassword(email, senha)
    .catch(function(err) {
      erroEl.style.display = 'block';
      erroEl.textContent = err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential'
        ? 'Senha incorreta.' : err.code === 'auth/user-not-found' ? 'E-mail não encontrado.' : 'Erro: ' + err.code;
    });
}



// ── HELPERS ──────────────────────────────────────────────────────────


function renderSec(cid, titulo, itens, mkFn) {
  var el = document.getElementById(cid);
  var p = document.createElement('p'); p.className = 'st';
  p.textContent = titulo+' ('+itens.length+')'; el.appendChild(p);
  if (!itens.length) { var v=document.createElement('div'); v.className='vazio'; v.textContent='Nenhum registro.'; el.appendChild(v); return; }
  itens.forEach(function(s){ el.appendChild(mkFn(s)); });
}

function popularSelectCat() {
  var sel = document.getElementById('mCat'); if(!sel) return;
  var val = sel.value; sel.innerHTML = '';
  CATS.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });
  if(val && CATS.includes(val)) sel.value = val;
}

  var el = document.getElementById('patrimonio'); el.innerHTML = '';

  // Disponibilidade
  var cfg = document.createElement('div'); cfg.className = 'cfg';

function renomearCategoria(antigo, novo, docs) {
  if(!confirm('Renomear "'+antigo+'" → "'+novo+'"?')) return;
  var batch=db.batch();
  docs.filter(function(d){return d.categoria===antigo;}).forEach(function(i){ batch.update(db.collection('patrimonio').doc(i.id),{categoria:novo}); });
  batch.commit().then(function(){ alert('Renomeado.'); });
}

function removerCategoria(cat, docs) {
  var itens=docs.filter(function(d){return d.categoria===cat;});
  if(!confirm('Remover "'+cat+'"'+(itens.length?' e seus '+itens.length+' equipamento(s)':'')+' ?')) return;
  var batch=db.batch();
  itens.forEach(function(i){ batch.delete(db.collection('patrimonio').doc(i.id)); });
  batch.commit();
}

  document.getElementById('mMarca').value  = item ? (item.marca||'') : '';
  document.getElementById('mPat').value    = item ? (item.patrimonio||'') : '';
  document.getElementById('mStatus').value = item ? (item.status||'Disponivel') : 'Disponivel';

  document.getElementById('modal').classList.add('on');
}

function fecharModal() { document.getElementById('modal').classList.remove('on'); }

function salvarEquip() {
  var id=document.getElementById('mDocId').value;
  var data={categoria:document.getElementById('mCat').value,descricao:document.getElementById('mDesc').value,
    marca:document.getElementById('mMarca').value,patrimonio:document.getElementById('mPat').value,

// ── IMPORTAÇÕES ──────────────────────────────────────────────────────
function carregarXLSX(cb) {
  if(window.XLSX){cb();return;}
  var s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=cb; document.head.appendChild(s);
}

function importarAlunos(inputEl) {
  var file=inputEl.files[0]; if(!file){alert('Selecione um arquivo .xlsx');return;}
  carregarXLSX(function(){
    var reader=new FileReader();
    reader.onload=function(e){
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array'}); var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1}); var header=rows[0]||[];
      var rgmCol=header.findIndex(function(h){return String(h).toUpperCase().includes('RGM');});
      var nomeCol=header.findIndex(function(h){return String(h).toUpperCase().includes('NOME');});
      var semCol=header.findIndex(function(h){return String(h).toUpperCase().includes('SEMESTRE');});
      if(rgmCol<0){alert('Coluna RGM não encontrada.');return;}
      var batch=db.batch(); var count=0;
      rows.slice(1).forEach(function(row){
        var rgm=String(row[rgmCol]||'').trim(); if(!rgm) return;
        var nome=(nomeCol>=0?String(row[nomeCol]||''):'').split(' ').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();}).join(' ');
        var sem=semCol>=0?String(row[semCol]||''):'';
        batch.set(db.collection('alunos').doc(),{rgm:rgm,nome:nome,semestre:sem,bloqueado:false}); count++;
      });
      batch.commit().then(function(){alert(count+' alunos importados!');});
    };
    reader.readAsArrayBuffer(file);
  });
}

function importarRGMs(inputEl) {
  var file=inputEl.files[0]; if(!file){alert('Selecione um arquivo .xlsx');return;}
  carregarXLSX(function(){
    var reader=new FileReader();
    reader.onload=function(e){
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array'}); var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1}); var header=rows[0]||[];
      var rgmCol=header.findIndex(function(h){return String(h).toUpperCase().includes('RGM');});
      if(rgmCol<0){alert('Coluna RGM não encontrada.');return;}
      var rgms=rows.slice(1).map(function(r){return String(r[rgmCol]||'').trim();}).filter(function(r){return r;});
      db.collection('config').doc('rgms4sem').set({rgms:rgms,atualizadoEm:new Date().toISOString()}).then(function(){
        document.getElementById('rgmCount').textContent=rgms.length+' RGMs autorizados.';
        alert(rgms.length+' RGMs importados!');
      });
    };
    reader.readAsArrayBuffer(file);
  });
}

function limparRGMs() {
  if(!confirm('Remover todos os RGMs autorizados?')) return;
  db.collection('config').doc('rgms4sem').set({rgms:[]}).then(function(){
    document.getElementById('rgmCount').textContent='0 RGMs autorizados.'; alert('Lista limpa.');
  });
}

function abrirModalAluno(aluno) {
  document.getElementById('mAlunoTitulo').textContent = aluno ? 'Editar Aluno' : 'Novo Aluno';
  document.getElementById('mAlunoId').value   = aluno ? aluno.id : '';
  document.getElementById('mAlunoNome').value = aluno ? (aluno.nome||'') : '';
  document.getElementById('mAlunoRgm').value  = aluno ? (aluno.rgm||'') : '';
  document.getElementById('mAlunoSem').value  = aluno ? (aluno.semestre||'') : '';
  document.getElementById('mAlunoWhats').value = aluno ? (aluno.whatsapp||'') : '';
  document.getElementById('mAlunoNasc').value  = aluno ? (aluno.nascimento||'') : '';
  document.getElementById('modalAluno').classList.add('on');
}
function salvarAluno() {
  var id=document.getElementById('mAlunoId').value;
  var data={
    nome:      document.getElementById('mAlunoNome').value.trim(),
    rgm:       document.getElementById('mAlunoRgm').value.trim(),
    semestre:  document.getElementById('mAlunoSem').value,
    whatsapp:  document.getElementById('mAlunoWhats').value.trim(),
    nascimento:document.getElementById('mAlunoNasc').value,
    bloqueado: false
  };
  if(!data.nome||!data.rgm){alert('Preencha nome e RGM.');return;}
  if(id) db.collection('alunos').doc(id).update(data);
  else   db.collection('alunos').add(data);
  document.getElementById('modalAluno').classList.remove('on');
}
function bloqueioEquipTurma(sem, cat, bloquear) {
  var semTxt=sem==='Todos'?'todos os semestres':'o '+sem+'º semestre';
  var catTxt=!cat||cat==='Todas'?'todos os equipamentos':'"'+cat+'"';
  if(!confirm((bloquear?'Bloquear':'Liberar')+' '+catTxt+' para '+semTxt+'?')) return;
  var key='bloq_'+(sem==='Todos'?'todos':sem)+'_'+(!cat||cat==='Todas'?'todas':cat.replace(/[^a-z0-9]/gi,'_'));
  db.collection('config').doc(key).set({semestre:sem,categoria:cat||'Todas',bloqueado:bloquear,atualizadoEm:new Date().toISOString()})
    .then(function(){alert((bloquear?'Bloqueado':'Liberado')+': '+catTxt+' para '+semTxt+'.');});
}

function bloqueioEstudio(estudio, bloquear) {
  var msg = (bloquear?'Bloquear':'Liberar')+' "'+estudio+'" para novos agendamentos?';
  if(!confirm(msg)) return;
  // Salvar tanto na chave específica quanto no status geral
  var key = 'bloqEstudio_'+estudio.replace(/[^a-z0-9]/gi,'_');
  var batch = db.batch();
  batch.set(db.collection('config').doc(key), {
    estudio: estudio, bloqueado: bloquear, atualizadoEm: new Date().toISOString()
  });
  // Se bloquear todos os 3 estúdios, atualizar estudioAtivo também
  batch.commit().then(function(){
    // Ler todos os bloqueios para calcular se algum estúdio ainda está livre
    db.collection('config').get().then(function(snap) {
      var bloqueados = [];
      snap.forEach(function(d) {
        if (d.id.startsWith('bloqEstudio_') && d.data().bloqueado) bloqueados.push(d.data().estudio);
      });
      // Atualizar status geral
      db.collection('config').doc('status').get().then(function(s) {
        var statusAtual = s.exists ? s.data() : {};
        statusAtual.bloqEstudiosIndividuais = bloqueados;
        // estudioAtivo = false só se TODOS estiverem bloqueados
        var todosBlq = ['Estúdio de Foto','Estúdio de Vídeo','Estúdio de Podcast']
          .every(function(e){ return bloqueados.indexOf(e) >= 0; });
        if (todosBlq) statusAtual.estudioAtivo = false;
        else statusAtual.estudioAtivo = true;
        db.collection('config').doc('status').set(statusAtual);
      });
    });
    alert((bloquear?'✅ Bloqueado':'✅ Liberado')+': '+estudio);
  });
}







function fmtData(d) {
  if (!d) return '—';
  // Se for yyyy-mm-dd converte para dd/mm/yyyy
  if (/^\d{4}-\d{2}-\d{2}/.test(String(d))) {
    var p = String(d).split('-');
    return p[2].substring(0,2) + '/' + p[1] + '/' + p[0];
  }
  return String(d);
}

function _waAbrir(whatsapp, msg) {
  var tel = (whatsapp||'').replace(/\D/g,'');
  if (tel.length < 10) { alert('WhatsApp não cadastrado ou inválido: ' + (whatsapp||'(vazio)')); return; }
  if (tel.slice(0,2) !== '55') tel = '55' + tel;
  window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(msg), '_blank');
}

// ── utilidades ───────────────────────────────────────────────────────
function esc(v) {
  return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function pad2(n) { return ('0' + n).slice(-2); }
function hojeISO() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function paraISO(v) {
  if (!v) return '';
  if (v && typeof v.toDate === 'function') { var t = v.toDate(); return t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate()); }
  var s = String(v), m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1]+'-'+m[2]+'-'+m[3];
  m = s.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m ? m[3]+'-'+m[2]+'-'+m[1] : '';
}
function calcDevolucao(iso) {
  var p = iso.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]), ds = d.getDay();
  d.setDate(d.getDate() + (ds === 4 ? 4 : ds === 5 ? 3 : ds === 6 ? 2 : 1));
  return pad2(d.getDate()) + '/' + pad2(d.getMonth()+1) + '/' + d.getFullYear() + ' até 19h';
}
function qs(obj) {
  return Object.keys(obj).map(function(k){ return '&' + k + '=' + encodeURIComponent(obj[k] == null ? '' : obj[k]); }).join('');
}
function splitLista(v) {
  return String(v || '').split(',').map(function(x){ return x.trim(); });
}
function dataCurta(iso) {
  var p = iso.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]);
  var dia = d.toLocaleDateString('pt-BR', {weekday:'short'}).replace('.','');
  return dia + ', ' + p[2] + '/' + p[1] + '/' + p[0];
}
function overlay(id, conteudoEl) {
  var antigo = document.getElementById(id); if (antigo) antigo.remove();
  var m = document.createElement('div'); m.id = id;
  m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px';
  var box = document.createElement('div');
  box.style.cssText = 'background:#fff;border-radius:10px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:24px';
  box.appendChild(conteudoEl); m.appendChild(box);
  m.addEventListener('mousedown', function(ev){ if (ev.target === m) m.remove(); });
  document.body.appendChild(m);
  return m;
}
function mkEl(tag, css, txt) {
  var e = document.createElement(tag); if (css) e.style.cssText = css; if (txt != null) e.textContent = txt; return e;
}

function patrimoniosEmUso(iso, ignoreId) {
  var uso = {};
  _estDocs.forEach(function(x){
    if (x.id === ignoreId || x.status !== 'Aprovado' || paraISO(x.data) !== iso) return;
    splitLista(x.patrimonios).forEach(function(p){ if (p) uso[p] = true; });
  });
  _empDocs.forEach(function(x){
    if (x.id === ignoreId || x.status !== 'Aprovado') return;
    var r = paraISO(x.dataRetirada), d = paraISO(x.dataDevolucao);
    if (!r || iso < r || (d && iso > d)) return;
    splitLista(x.patrimonios).forEach(function(p){ if (p) uso[p] = true; });
  });
  return uso;
}

  return base;
}

      return (a.categoria||'').localeCompare(b.categoria||'') || (a.descricao||'').localeCompare(b.descricao||'') || (a.patrimonio||'').localeCompare(b.patrimonio||'');

// Chamada ao Apps Script com o token do usuário logado (POST, sem limite de URL)
function chamarGS(acao, params) {
  var user = firebase.auth().currentUser;
  if (!user) return Promise.reject(new Error('Sessão expirada. Entre novamente.'));
  return user.getIdToken().then(function(tk){
    var body = new URLSearchParams();
    body.append('acao', acao); body.append('idToken', tk);
    Object.keys(params || {}).forEach(function(k){ body.append(k, params[k] == null ? '' : params[k]); });
    return fetch(SU, {method:'POST', body: body}).then(function(r){ return r.json(); });
  }).then(function(res){
    if (res && res.erro === 'Não autorizado') alert('O Apps Script recusou a chamada: seu usuário não está autorizado (confira CONFIG.adminEmails no script).');
    return res;
  });
}

function sincronizarBloqueios(todos) {
  if (!_autoBloq || !_todosAlunos.length) return;
  var atrasados = {};
  todos.forEach(function(i){ if (i.estado === 'atrasado' && i.doc.rgm) atrasados[String(i.doc.rgm)] = true; });
  var apagar = firebase.firestore.FieldValue.delete();
  _todosAlunos.forEach(function(a){
    var rgm = String(a.rgm || ''), ref = db.collection('alunos').doc(a.id);
    if (_bloqPend[a.id]) return;
    if (atrasados[rgm] && !a.bloqueado) {
      _bloqPend[a.id] = true;
      ref.update({bloqueado: true, bloqueadoPorAtraso: true}).catch(function(){}).then(function(){ delete _bloqPend[a.id]; });
    } else if (!atrasados[rgm] && a.bloqueadoPorAtraso) {
      _bloqPend[a.id] = true;
      var up = {bloqueadoPorAtraso: apagar}; if (a.bloqueado) up.bloqueado = false;
      ref.update(up).catch(function(){}).then(function(){ delete _bloqPend[a.id]; });
    }
  });
}

function passaFiltroControle(it, comStatus) {

// ── calendário ───────────────────────────────────────────────────────
function renderCalendario(box, todos) {

  function mover(delta) { var d = new Date(ano, mes + delta, 1); _ctlMes = d.getFullYear() + '-' + pad2(d.getMonth() + 1); renderControle(); }
  nav.appendChild(nb('◀', function(){ mover(-1); }));
  nav.appendChild(mkEl('div', 'font-size:16px;font-weight:700;color:#4a1270;min-width:170px;text-align:center;text-transform:capitalize', new Date(ano, mes, 1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'})));
  nav.appendChild(nb('▶', function(){ mover(1); }));

  var leg = mkEl('div', 'margin-left:auto;font-size:11px;color:#6b6b6b', '🟪 retirada   🟩 devolução   🟥 atrasada   🟦 estúdio');
  nav.appendChild(leg); box.appendChild(nav);

  var grid = mkEl('div', 'display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px');

  var primeiro = new Date(ano, mes, 1).getDay(), dias = new Date(ano, mes + 1, 0).getDate();
  for (var v = 0; v < primeiro; v++) grid.appendChild(mkEl('div', ''));
  for (var dia = 1; dia <= dias; dia++) {
    (function(dia){

      var cel = mkEl('div', 'background:#fff;border:1.5px solid ' + (sel ? '#6a1e9a' : iso === hoje ? '#d9a400' : '#ddd0ea') + ';border-radius:8px;min-height:86px;padding:4px;cursor:pointer;overflow:hidden');
      cel.appendChild(mkEl('div', 'font-size:12px;font-weight:' + (iso === hoje ? '700' : '600') + ';color:' + (iso === hoje ? '#b78900' : '#333') + ';margin-bottom:3px', String(dia)));
      lista.slice(0, 3).forEach(function(o){
        var atras = o.t === 'devolucao' && o.it.estado === 'atrasado';
        var cor = o.t === 'retirada' ? '#e9d5f5;color:#4a1270' : o.t === 'devolucao' ? (atras ? '#f8d7da;color:#721c24' : '#d4edda;color:#155724') : '#d6e4ff;color:#1d3f8c';
        var nome = (o.it ? o.it.doc.nome : o.doc.nome) || '';
        var pre = o.t === 'retirada' ? '↑ ' : o.t === 'devolucao' ? '↓ ' : '📷 ';
        cel.appendChild(mkEl('div', 'font-size:10px;font-weight:600;border-radius:4px;padding:1px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:' + cor, pre + nome.split(' ')[0]));

      cel.onclick = function(){ _ctlDia = iso; renderControle(); };

    var evs = ev[_ctlDia] || [];
    if (!evs.length) det.appendChild(mkEl('div', 'font-size:12px;color:#6b6b6b', 'Nada agendado neste dia.'));
    var g2 = mkEl('div', 'display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:10px');
    evs.forEach(function(o){
      var rotulo = o.t === 'retirada' ? 'RETIRADA' : o.t === 'devolucao' ? 'DEVOLUÇÃO' : 'ESTÚDIO';
      var w = document.createElement('div');
      w.appendChild(mkEl('div', 'font-size:10px;font-weight:700;color:#6a1e9a;margin-bottom:3px', rotulo));
      if (o.it) w.appendChild(cartaoControle(o.it));
      else {
        var x = o.doc;
        var c = mkEl('div', 'border:1px solid #ddd0ea;border-left:4px solid #1d3f8c;border-radius:8px;padding:12px;background:#fff');
        c.appendChild(mkEl('div', 'font-weight:600;font-size:14px', x.nome || ''));
        c.appendChild(mkEl('div', 'font-size:11px;color:#6b6b6b', 'RGM ' + (x.rgm || '') + ' · ' + (x.tipoEstudio || 'Estúdio') + ' às ' + (x.horario || '') + ' · sem equipamentos'));

    det.appendChild(g2); box.appendChild(det);
  }
}

//  v8 — conflitos, ficha do aluno, histórico, nascimento, auditoria
// ═════════════════════════════════════════════════════════════════════
var _auditDocs = [], _auditUnsub = null;

function isoLocal(v) {
  if (!v) return '';
  var s = String(v);
  if (s.length > 10 && s.indexOf('T') > 0) { var d = new Date(s); if (!isNaN(d)) return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  return paraISO(v);
}
function diasEntre(a, b) { // b - a, em dias
  var pa = a.split('-'), pb = b.split('-');
  return Math.round((new Date(+pb[0], +pb[1]-1, +pb[2]) - new Date(+pa[0], +pa[1]-1, +pa[2])) / 86400000);
}
function dataBR3(iso) { var p = (iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; }

// ── nascimento e idade ───────────────────────────────────────────────
function alunoPorRgm(rgm) {
  return _todosAlunos.filter(function(a){ return String(a.rgm || '') === String(rgm || ''); })[0] || null;
}
function nascDe(s) {
  var a = alunoPorRgm(s.rgm);
  return paraISO((a && a.nascimento) || s.nascimento || s.nascimentoE || '');
}
function idadeEm(nascISO, refISO) {
  if (!nascISO) return null;
  var n = nascISO.split('-'), r = (refISO || hojeISO()).split('-');
  var id = +r[0] - +n[0];
  if (+r[1] < +n[1] || (+r[1] === +n[1] && +r[2] < +n[2])) id--;
  return id;
}
function nascTexto(n, refISO) {
  var iso = paraISO(n); if (!iso) return '';
  var id = idadeEm(iso, refISO);
  return dataBR3(iso) + ' (' + id + ' anos)' + (id < 18 ? ' · MENOR DE IDADE' : '');
}

// ── conflitos de patrimônio ──────────────────────────────────────────
function nomePat(p) {
  var d = _patDocs.filter(function(x){ return String(x.patrimonio) === String(p); })[0];
  return d ? (d.descricao || d.categoria || '') : '';
}
function periodoDe(s, isEst) {
  if (isEst) { var d = paraISO(s.data); return [d, d]; }
  var r = paraISO(s.dataRetirada); return [r, paraISO(s.dataDevolucao) || r];
}
function usoDetalhado(ini, fim, ignoreId) {
  var uso = {}, hoje = hojeISO();
  function marca(lista, quem, desc) { splitLista(lista).forEach(function(p){ if (p && !uso[p]) uso[p] = quem + ' (' + desc + ')'; }); }
  _estDocs.forEach(function(x){
    if (x.id === ignoreId || x.status !== 'Aprovado' || x.devolvidoEm) return;
    var d = paraISO(x.data);
    if (d >= ini && d <= fim) marca(x.patrimonios, x.nome, 'estúdio ' + dataBR3(d));
  });
  _empDocs.forEach(function(x){
    if (x.id === ignoreId || x.status !== 'Aprovado' || x.devolvidoEm) return;
    var r = paraISO(x.dataRetirada), d = paraISO(x.dataDevolucao) || r;
    var fimEf = (x.retiradoEm && d < hoje) ? '9999-12-31' : d;
    if (r <= fim && fimEf >= ini) marca(x.patrimonios, x.nome, 'empréstimo ' + dataBR3(r) + ' a ' + dataBR3(d));
  });
  return uso;
}
function conflitosDe(s, isEst) {
  var per = periodoDe(s, isEst); if (!per[0]) return [];
  var uso = usoDetalhado(per[0], per[1], s.id), out = [];
  splitLista(s.patrimonios).forEach(function(p){
    if (!p) return;
    var nm = nomePat(p), rotulo = p + (nm ? ' ' + nm : '');
    if (uso[p]) out.push(rotulo + ' já está com ' + uso[p]);
    else {
      var pd = _patDocs.filter(function(x){ return String(x.patrimonio) === p; })[0];
      if (pd && pd.status === 'Manutencao') out.push(rotulo + ' está em manutenção');
    }
  });
  return out;
}
function conflitoDet(s, isEst) {
  var c = conflitosDe(s, isEst);
  return c.length ? [['⚠ CONFLITO', c.join(' | ')]] : [];
}
function conflitoTag(s, isEst) { return conflitosDe(s, isEst).length ? ' · ⚠ CONFLITO' : ''; }

function avisosAprovacao(s, isEst) {
  var linhas = [], c = conflitosDe(s, isEst);
  if (c.length) linhas.push('\n⚠ CONFLITO DE ITENS:\n- ' + c.join('\n- '));
  var f = _tudoCarregado ? fichaDe(s.rgm) : {atrasos: [], avarias: []};
  if (f.atrasos.length || f.avarias.length) linhas.push('\n⚠ Histórico: ' + f.atrasos.length + ' atraso(s), ' + f.avarias.length + ' avaria(s).');
  return linhas.join('\n');
}
function confirmarAprov(base, s, isEst) {
  if (!confirm(base + avisosAprovacao(s, isEst))) return false;
  var per = periodoDe(s, isEst), id = idadeEm(nascDe(s), per[0] || hojeISO());
  if (id !== null && id < 18) return confirm('ATENÇÃO: ' + s.nome + ' tem ' + id + ' anos na data da ' + (isEst ? 'reserva' : 'retirada') + ' (menor de idade).\nAprovar mesmo assim?');
  return true;
}

// ── ficha do aluno ───────────────────────────────────────────────────
function fichaDe(rgm) {
  rgm = String(rgm || '');

  if (!rk.length) sR.appendChild(mkEl('div', 'font-size:12px;color:#6b6b6b', 'Ainda sem reservas aprovadas.'));
  rk.forEach(function(f, i){
    var fl = (f.fin['Freela/Trabalho'] || 0);
    linha(sR, (i + 1) + '. ' + f.nome + ' · ' + f.aprov + ' reservas' + (fl ? ' · ' + fl + ' freela/trabalho' : '') + (f.atrasos.length ? ' · ⚠ ' + f.atrasos.length + ' atraso(s)' : '') + (f.avarias.length ? ' · 🔧 ' + f.avarias.length + ' avaria(s)' : ''), 'Ficha', function(){ abrirFicha(f.rgm, f.nome); }, (f.atrasos.length || f.avarias.length) ? '#8a4b0f' : '');
  });

  var oc = fichas.filter(function(f){ return f.atrasos.length || f.avarias.length; }).sort(function(a, b){ return (b.atrasos.length + b.avarias.length) - (a.atrasos.length + a.avarias.length); });
  var sO = secao('Alunos com ocorrências (' + oc.length + ')');
  if (!oc.length) sO.appendChild(mkEl('div', 'font-size:12px;color:#6b6b6b', 'Nenhum atraso ou avaria registrado.'));
  oc.forEach(function(f){ linha(sO, f.nome + ' · ' + f.atrasos.length + ' atraso(s) · ' + f.avarias.length + ' avaria(s)', 'Ficha', function(){ abrirFicha(f.rgm, f.nome); }, '#c0392b'); });

  var sF = secao('Finalidade das reservas aprovadas');
  sF.appendChild(mkEl('div', 'font-size:13px', contagemTxt(finTotal)));
  var sI = secao('Itens mais usados');
  var top = Object.keys(itensTotal).sort(function(a, b){ return itensTotal[b] - itensTotal[a]; }).slice(0, 10);
  sI.appendChild(mkEl('div', 'font-size:13px', top.length ? top.map(function(k){ return k + ' (' + itensTotal[k] + ')'; }).join(', ') : '—'));

  var sL = secao('Registro de ações (últimas ' + _auditDocs.length + ')');
  if (!_auditDocs.length) sL.appendChild(mkEl('div', 'font-size:12px;color:#6b6b6b', 'Nenhuma ação registrada ainda. As próximas aprovações, recusas e devoluções aparecem aqui.'));
  _auditDocs.forEach(function(a){
    var d = new Date(a.em), q = isNaN(d) ? '' : pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    linha(sL, q + ' · ' + a.acao + ' · ' + (a.nome || '') + (a.detalhe ? ' · ' + a.detalhe : '') + ' · ' + (a.por || ''));
  });
}

// ── mensagens de WhatsApp: datas no formato brasileiro, sem emojis ───
function fmtData(d) {
  if (!d) return '—';
  if (typeof d.toDate === 'function') d = d.toDate();
  if (d instanceof Date) return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear();
  var iso = paraISO(d);
  return iso ? dataBR3(iso) : String(d);
}
function _waAbrir(whatsapp, msg) {
  var tel = (whatsapp || '').replace(/\D/g, '');
  if (tel.length < 10) { alert('WhatsApp não cadastrado ou inválido: ' + (whatsapp || '(vazio)')); return; }
  if (tel.slice(0, 2) !== '55') tel = '55' + tel;
  // emojis são removidos porque chegam quebrados no WhatsApp em alguns navegadores
  msg = String(msg).replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\uFE0F\u200D]/gu, '').replace(/^[ \t]+/gm, '').replace(/[ \t]+$/gm, '');
  window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(msg), '_blank');
}
function abrirWA(nome, whatsapp, tipo, status, data, horario, motivo) {
  if (status !== 'Aprovado') { abrirWARecusa(nome, whatsapp, tipo, data, horario, motivo); return; }
  var dataFmt = fmtData(data), msg;
  if (tipo === 'estudio') {
    msg = 'Olá, ' + nome + '!\n\nSua reserva no *Estúdio PP da UNIGRAN Capital* foi *aprovada*!\n\n' +
      'Data: *' + dataFmt + '*\nHorário: *' + (horario || '') + '*\n\n' +
      'O Termo de Uso será enviado por e-mail. Assine e entregue uma via à Coordenação *antes da retirada dos equipamentos*.\n\n' +
      '_Publicidade & Propaganda — UNIGRAN Capital_';
  } else {
    msg = 'Olá, ' + nome + '!\n\nSua solicitação de *empréstimo de equipamentos* foi *aprovada*!\n\n' +
      'Retirada: *' + dataFmt + '*\n\n' +
      'O Termo de Responsabilidade será enviado por e-mail. Assine e entregue uma via à Coordenação *antes da retirada*.\n\n' +
      '_Publicidade & Propaganda — UNIGRAN Capital_';
  }
  _waAbrir(whatsapp, msg);
}

// ═════════════════════════════════════════════════════════════════════
//  v9 — carga parcial (últimos 30 dias), datas bloqueadas
// ═════════════════════════════════════════════════════════════════════
var DIAS_JANELA = 30;
var _fonte = {est: {}, emp: {}}, _verTodos = false, _tudoCarregado = false, _tudoUnsub = [], _datasBloq = [];

function corteISO() { return new Date(Date.now() - DIAS_JANELA * 86400000).toISOString(); }

function visiveis(arr, tipo) {
  if (_verTodos) return arr;
  var corte = corteISO(), hoje = hojeISO();
  return arr.filter(function(s){
    if ((s.enviadoEm || '') >= corte || s.status === 'Pendente') return true;
    if (tipo === 'est') return paraISO(s.data) >= hoje;
    return paraISO(s.dataDevolucao) >= hoje || (s.retiradoEm && !s.devolvidoEm);
  });
}
function recompor(tipo) {
  var u = {};
  Object.keys(_fonte[tipo]).forEach(function(n){ var m = _fonte[tipo][n]; Object.keys(m).forEach(function(id){ u[id] = m[id]; }); });
  var arr = Object.keys(u).map(function(id){ return u[id]; }).sort(function(a, b){ return String(b.enviadoEm || '').localeCompare(String(a.enviadoEm || '')); });
  if (tipo === 'est') { _estDocs = arr; renderEstudio(visiveis(arr, 'est')); }
  else { _empDocs = arr; renderEquipamentos(visiveis(arr, 'emp')); }
  renderControle(); atualizarBarraPeriodo();
}
function ouvir(tipo, nome, colecao, consulta) {
  return consulta(db.collection(colecao)).onSnapshot(function(snap){
    var m = {}; snap.forEach(function(d){ m[d.id] = Object.assign({id: d.id}, d.data()); });
    _fonte[tipo][nome] = m; recompor(tipo);
  }, function(err){ console.error(colecao + ' (' + nome + '):', err); });
}
function iniciarFontesEst() {
  var corte = corteISO(), hoje = hojeISO(), c = 'solicitacoes';
  var a = ouvir('est', 'recente', c, function(r){ return r.where('enviadoEm', '>=', corte); });
  var b = ouvir('est', 'pendente', c, function(r){ return r.where('status', '==', 'Pendente'); });
  var d = ouvir('est', 'futuro', c, function(r){ return r.where('data', '>=', hoje); });
  return function(){ a(); b(); d(); };
}
function iniciarFontesEmp() {
  var corte = corteISO(), c = 'emprestimos';
  var a = ouvir('emp', 'recente', c, function(r){ return r.where('enviadoEm', '>=', corte); });
  var b = ouvir('emp', 'pendente', c, function(r){ return r.where('status', '==', 'Pendente'); });
  var d = ouvir('emp', 'aprovado', c, function(r){ return r.where('status', '==', 'Aprovado'); });
  return function(){ a(); b(); d(); };
}
// Carrega todo o histórico (usado pela ficha, aba Histórico e botão "ver anteriores")
function carregarTudo() {
  if (_tudoCarregado) return Promise.resolve();
  _tudoCarregado = true;
  atualizarBarraPeriodo();
  var esperas = [['est', 'solicitacoes'], ['emp', 'emprestimos']].map(function(par){
    return new Promise(function(res){
      var primeiro = true;
      var un = db.collection(par[1]).onSnapshot(function(snap){
        var m = {}; snap.forEach(function(d){ m[d.id] = Object.assign({id: d.id}, d.data()); });
        _fonte[par[0]].tudo = m; recompor(par[0]);
        if (primeiro) { primeiro = false; res(); }
      }, function(){ if (primeiro) { primeiro = false; res(); } });
      _tudoUnsub.push(un);
    });
  });
  return Promise.all(esperas);
}
function comTudo(fn) {
  if (_tudoCarregado && _fonte.est.tudo && _fonte.emp.tudo) { fn(); return; }
  var aviso = overlay('_carregando', mkEl('div', 'text-align:center;padding:20px;font-size:14px', 'Carregando o histórico completo...'));
  carregarTudo().then(function(){ var a = document.getElementById('_carregando'); if (a) a.remove(); fn(); });
}
function atualizarBarraPeriodo() {
  var b = document.getElementById('barraPeriodo'); if (!b) return;
  b.innerHTML = '';
  if (_verTodos) {
    b.appendChild(mkEl('span', 'font-size:12px;color:#4a1270', 'Mostrando todo o histórico.'));
    var v = mkEl('button', 'border:1.5px solid #6a1e9a;background:#fff;color:#6a1e9a;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif', 'Voltar aos últimos ' + DIAS_JANELA + ' dias');
    v.onclick = function(){ _verTodos = false; recompor('est'); recompor('emp'); };
    b.appendChild(v);
  } else {
    b.appendChild(mkEl('span', 'font-size:12px;color:#4a1270', 'Mostrando os últimos ' + DIAS_JANELA + ' dias, pendentes e reservas futuras.'));
    var x = mkEl('button', 'border:none;background:#6a1e9a;color:#fff;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif', '📂 Ver anteriores');
    x.onclick = function(){ x.textContent = 'Carregando...'; carregarTudo().then(function(){ _verTodos = true; recompor('est'); recompor('emp'); }); };
    b.appendChild(x);
  }
}
function montarBarraPeriodo() {
  if (document.getElementById('barraPeriodo')) return;
  var p = document.querySelector('.painel'); if (!p) return;
  var b = mkEl('div', 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #ddd0ea;border-radius:8px;padding:8px 14px;margin-bottom:14px');
  b.id = 'barraPeriodo'; p.insertBefore(b, p.firstChild); atualizarBarraPeriodo();
}

// ── datas bloqueadas (feriados, recesso) ─────────────────────────────
function iniciarDatasBloq() {
  return db.collection('config').doc('datasBloqueadas').onSnapshot(function(snap){
    _datasBloq = snap.exists && Array.isArray(snap.data().itens) ? snap.data().itens : [];
    var el = document.getElementById('listaDatasBloq'); if (el) renderListaDatasBloq(el);
  });
}
function salvarDatasBloq() {
  return db.collection('config').doc('datasBloqueadas').set({itens: _datasBloq}, {merge: true});
}
function renderListaDatasBloq(el) {
  el.innerHTML = '';
  var hoje = hojeISO();
  var lista = _datasBloq.map(function(x, i){ return {x: x, i: i}; }).filter(function(o){ return (o.x.ate || o.x.de) >= hoje; })
    .sort(function(a, b){ return a.x.de.localeCompare(b.x.de); });
  if (!lista.length) { el.appendChild(mkEl('div', 'font-size:12px;color:#6b6b6b', 'Nenhuma data bloqueada.')); return; }
  var alvoTxt = {ambos: 'estúdio e equipamentos', estudio: 'só estúdio', equip: 'só equipamentos'};
  lista.forEach(function(o){
    var l = mkEl('div', 'display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid #f0eaf6;padding:6px 0;font-size:13px');
    l.appendChild(mkEl('div', 'flex:1', dataBR3(o.x.de) + (o.x.ate && o.x.ate !== o.x.de ? ' a ' + dataBR3(o.x.ate) : '') + ' · ' + (alvoTxt[o.x.alvo] || 'estúdio e equipamentos') + (o.x.motivo ? ' · ' + o.x.motivo : '')));
    var rm = mkEl('button', 'border:none;background:#fde;color:#c0392b;border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:700', '✕');
    rm.onclick = function(){ if (confirm('Liberar esta data novamente?')) { _datasBloq.splice(o.i, 1); salvarDatasBloq(); } };
    l.appendChild(rm); el.appendChild(l);
  });
}
function boxDatasBloqueadas() {
  var box = document.createElement('div'); box.className = 'cfg';
  box.appendChild(mkEl('h3', '', 'Datas bloqueadas'));
  box.appendChild(mkEl('p', 'font-size:12px;color:#6b6b6b;margin-bottom:12px', 'Feriados, recesso e dias sem atendimento. Os dias bloqueados não aparecem para o aluno.'));
  var css = 'border:1.5px solid #ddd0ea;border-radius:8px;padding:8px 10px;font-size:13px;font-family:Inter,sans-serif;background:#fff';
  var linha = mkEl('div', 'display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px');
  var de = document.createElement('input'); de.type = 'date'; de.style.cssText = css; de.title = 'De';
  var ate = document.createElement('input'); ate.type = 'date'; ate.style.cssText = css; ate.title = 'Até (opcional, para vários dias)';
  var motivo = document.createElement('input'); motivo.type = 'text'; motivo.placeholder = 'Motivo (ex.: Feriado)'; motivo.style.cssText = css + ';flex:1;min-width:140px';
  var alvo = document.createElement('select'); alvo.style.cssText = css;
  [['ambos', 'Estúdio e equipamentos'], ['estudio', 'Só estúdio'], ['equip', 'Só equipamentos']].forEach(function(o){ var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; alvo.appendChild(op); });
  var add = mkEl('button', 'border:none;background:#6a1e9a;color:#fff;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:Inter,sans-serif', 'Bloquear');
  add.onclick = function(){
    if (!de.value) { alert('Escolha a data (ou a primeira data do período).'); return; }
    var fim = ate.value && ate.value >= de.value ? ate.value : de.value;
    _datasBloq.push({de: de.value, ate: fim, motivo: motivo.value.trim(), alvo: alvo.value});
    salvarDatasBloq().catch(function(e){ alert('Erro ao salvar: ' + e.message); });
    de.value = ''; ate.value = ''; motivo.value = '';
  };
  [de, ate, motivo, alvo, add].forEach(function(e){ linha.appendChild(e); });
  box.appendChild(mkEl('div', 'font-size:11px;color:#6b6b6b;margin-bottom:4px', 'De / Até (o segundo campo é opcional)'));
  box.appendChild(linha);
  var lista = document.createElement('div'); lista.id = 'listaDatasBloq'; box.appendChild(lista);
  renderListaDatasBloq(lista);
  return box;
}

</script>
